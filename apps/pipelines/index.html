<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipeline Builder — Neurodesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Workflow</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="library">Start from</label>
            <select id="library" disabled><option value="">Empty workflow</option></select>
          </div>
          <label class="nd-file" id="dropZone">
            <input id="workflowInput" type="file" data-neurodesk-input="protocol" accept=".json,application/json" aria-label="Open a NeuroFlow workflow" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop or open a .workflow.json</span>
          </label>
          <p id="fileInfo" class="nd-file-info" hidden></p>
          <div class="nd-field">
            <label for="workflowId">Workflow id</label>
            <input id="workflowId" type="text" autocomplete="off" spellcheck="false" />
          </div>
          <div class="nd-field">
            <label for="workflowDescription">Description</label>
            <input id="workflowDescription" type="text" autocomplete="off" />
          </div>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Steps</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="toolSelect">Tool
              <span class="nd-info-icon" tabindex="0" aria-label="About the tools">i<span class="nd-info-tooltip">Every operation of the web apps deployed with this page. A new step binds its inputs to the latest earlier output of a matching type, preferring one whose name matches; change any binding in the step list.</span></span>
            </label>
            <select id="toolSelect" disabled><option value="">Loading tools…</option></select>
            <p id="toolHint" class="nd-hint"></p>
          </div>
          <button id="addStep" class="nd-btn nd-btn-secondary" type="button" disabled>Add step</button>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Export workflow</button>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <p id="emptyState" class="nd-viewer-empty">Add a step, or start from a shipped workflow.</p>
        <section id="stepsReport" class="nd-viewer-report" aria-label="Steps" hidden>
          <div id="stepList" class="nd-report-stack"></div>
        </section>
        <section id="jsonReport" class="nd-viewer-report" aria-label="Workflow JSON" hidden>
          <pre class="nd-command"><code id="jsonPreview"></code></pre>
        </section>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Validation progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel" aria-label="Cancel" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>Chain the operations of the Neurodesk web apps into a <a href="https://github.com/niivue/neuroflow-spec">NeuroFlow</a> workflow and download it. The page builds and checks the workflow; it runs nothing.</p>
      <p>Each step is one app operation. Its inputs take a workflow input or an earlier step's output of a compatible type, and its settings default to the app's own. Tick the outputs the workflow should return.</p>
      <p>The workflow is checked as you edit with the NeuroFlow validator compiled to WebAssembly, the same one <code>neuroflow-mcp</code> runs. Run the exported file with the Neurodesk desktop suite through <code>neuroflow-mcp</code>.</p>
      <p>The tools are published next to this page at <code>neuroflow/neuroflow-registry.json</code>, so NeuroFlow can load the catalog by URL.</p>
    </template>
    <template id="privacyContent"><p>Workflows are built in this browser and are never uploaded. The page loads no images.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
