<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANTs — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Images</summary>
        <div class="nd-section-content">
          <div id="imagePair"></div>
          <div class="nd-field" id="extractField">
            <label id="extractLabel">Brain extraction <span class="nd-info-icon" tabindex="0" aria-label="About brain extraction">i<span class="nd-info-tooltip">Registration expects brain-only images: scalp produces artifacts. MindGrab removes the scalp locally. The examples and the brain template are already brain-only.</span></span></label>
            <div class="nd-row" role="group" aria-labelledby="extractLabel">
              <button id="fixedExtractButton" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" aria-label="Brain extract the fixed image" disabled>Fixed</button>
              <button id="movingExtractButton" class="nd-btn nd-btn-secondary nd-btn-sm" type="button" aria-label="Brain extract the moving image" disabled>Moving</button>
            </div>
          </div>
        </div>
      </details>
      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Registration</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label id="methodLabel">Method · Affine + SyN <span class="nd-info-icon" tabindex="0" aria-label="About the registration method">i<span class="nd-info-tooltip">Affine then SyN diffeomorphic registration with the Mattes mutual-information metric, the ANTsPy SyN schedule, seed 42. SyN on 1 mm brains takes about a minute on a fast laptop, longer on older hardware.</span></span></label>
          </div>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Register images</button>
        </div>
      </details>
      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content"><div id="resultList"></div></div>
      </details>
      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
      <button id="standaloneBtn" type="button" hidden>Standalone</button>
    </header>
    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <div class="nd-viewer-panel-grid">
          <section class="nd-viewer-panel" aria-label="Fixed image panel">
            <span class="nd-viewer-panel-title">Fixed</span>
            <canvas id="glFixed" aria-label="Fixed image viewer"></canvas>
          </section>
          <section class="nd-viewer-panel" aria-label="Moving image panel">
            <span class="nd-viewer-panel-title">Moving</span>
            <canvas id="glMoving" aria-label="Moving image viewer"></canvas>
          </section>
          <section class="nd-viewer-panel" aria-label="Resliced image panel">
            <span class="nd-viewer-panel-title">Resliced</span>
            <canvas id="glResliced" aria-label="Resliced registration viewer"></canvas>
          </section>
        </div>
        <p id="emptyState" class="nd-viewer-empty">Choose an example or load the fixed and moving images to begin.</p>
        <p id="viewerError" class="nd-viewer-notice" hidden></p>
      </div>
      <div class="nd-viewer-info"><span class="nd-viewer-info-primary">Fixed and resliced crosshairs are linked</span><span id="location"></span></div>
    </main>
    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Loading…</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Registration progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel registration" aria-label="Cancel registration" hidden>×</button>
    </footer>
    <template id="aboutContent"><p>ANTs registers a moving image to a fixed image with an affine stage followed by SyN symmetric diffeomorphic registration, using ANTs 2.6.2 compiled to WebAssembly. Registration expects brain-only images: scalp produces artifacts. Brain extract custom images locally with MindGrab under Brain extraction; the examples and the brain template are already brain-only. Built-in templates can stand in for the fixed image.</p></template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>
    <template id="standaloneContent">
      <p>The browser runs ANTs 2.6.2 compiled to WebAssembly with the ANTsPy <code>SyN</code> schedule. The same registration on your computer or an HPC system uses <code>antsRegistration</code> from an ANTs install (for example the Neurodesk <code>ants</code> container) with these arguments, then <code>antsApplyTransforms</code> to reslice.</p>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
