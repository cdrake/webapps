name: dwi-native

on:
  pull_request:
    paths:
      - 'packages/components/package.json'
      - 'packages/dwi2trx/package.json'
      - 'packages/node-drivers/package.json'
      - '.github/workflows/dwi-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/dwi/**'
      - 'packages/noddi/**'
      - 'packages/degibbs/**'
      - 'packages/dwidenoise/**'
      - 'packages/components/src/file-io/NiftiUtils.js'
      - 'packages/dwi2trx/src/gradients.js'
      - 'packages/dwi2trx/src/node-runner.js'
      - 'packages/dwi2trx/src/tensor.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/niimath.js'
  push:
    branches: [main]
    paths:
      - 'packages/components/package.json'
      - 'packages/dwi2trx/package.json'
      - 'packages/node-drivers/package.json'
      - '.github/workflows/dwi-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/dwi/**'
      - 'packages/noddi/**'
      - 'packages/degibbs/**'
      - 'packages/dwidenoise/**'
      - 'packages/components/src/file-io/NiftiUtils.js'
      - 'packages/dwi2trx/src/gradients.js'
      - 'packages/dwi2trx/src/node-runner.js'
      - 'packages/dwi2trx/src/tensor.js'
      - 'packages/node-drivers/src/mindgrab.js'
      - 'packages/node-drivers/src/mindgrab-worker.js'
      - 'packages/node-drivers/src/niimath.js'
  workflow_dispatch:

concurrency:
  group: dwi-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: exes/dwi tests, clippy and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Test
        working-directory: exes/dwi
        run: cargo +1.98.0 test --workspace --locked
      - name: Clippy
        working-directory: exes/dwi
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        working-directory: exes/dwi
        run: cargo +1.98.0 fmt --all --check

  # The hmc tests against NiFreeze's and QSIPrep's runs on ds005577 sub-107 (hmc/reference/ on
  # Hugging Face, pinned by exes/dwi/hmc/validation/reference.manifest.json). The job fetches
  # only the subsets that tests read (115 MB of 439 MB), and HMC_REQUIRE_REFERENCE turns each
  # missing-data skip into a failure. Add a subset here when a test starts to read it.
  hmc-reference:
    name: exes/dwi tests on the pinned hmc reference data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATA: ${{ github.workspace }}/../hmc-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Cache the reference downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/../hmc-reference
          key: hmc-reference-${{ hashFiles('exes/dwi/hmc/validation/reference.manifest.json') }}-decomposition-clip-gp
      - name: Fetch the reference subsets (sha256-checked)
        run: python3 exes/dwi/hmc/validation/fetch_reference.py "$DATA" decomposition clip gp >> "$GITHUB_ENV"
      - name: Test on the reference data, release build
        working-directory: exes/dwi
        env:
          HMC_REQUIRE_REFERENCE: '1'
        run: cargo +1.98.0 test --release --workspace --locked -- --nocapture

  wasm-source:
    name: committed WASM modules equal a rebuild from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare noddi
        run: bash packages/noddi/scripts/build-wasm.sh --check
      - name: Rebuild and compare degibbs
        run: bash packages/degibbs/scripts/build-wasm.sh --check
      - name: Rebuild and compare dwidenoise
        run: bash packages/dwidenoise/scripts/build-wasm.sh --check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install package test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @neurodesk/noddi... --filter @neurodesk/degibbs... --filter @neurodesk/dwidenoise...
      - name: noddi package tests on the committed module
        working-directory: packages/noddi
        run: node --test test/*.test.js
      - name: degibbs package tests on the committed module
        working-directory: packages/degibbs
        run: node --test test/*.test.js
      - name: dwidenoise package tests on the committed module
        working-directory: packages/dwidenoise
        run: node --test test/*.test.js
