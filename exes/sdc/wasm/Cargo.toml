# The sdc app's WebAssembly module: a plain C ABI over sdc-core, no wasm-bindgen.
# packages/sdc/src/wasm.js drives it; packages/sdc/scripts/build-wasm.sh builds it.
[package]
name = "sdc-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sdc-core = { path = "../core" }
